name: Lint styles

on:
  pull_request:
    paths:
      - "styles/**"
      - "postcss.config.js"
      - "stylelint.config.js"

jobs:
  stylelint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # fail_level: none — non-blocking on purpose, this only leaves a PR comment.
      - uses: reviewdog/action-stylelint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_level: none
          filter_mode: added
          stylelint_input: "styles/**/*.css"
