name: Build and deploy docs site

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CANONICAL_DOMAIN: https://kg-marketplace.pages.dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        with:
          path: .cache
          key: build-${{ hashFiles('images/**', 'icons-src/**') }}
          restore-keys: build-
      - run: npm ci
      - run: npm run build
        env:
          ELEVENTY_SITE_ORIGIN: ${{ env.CANONICAL_DOMAIN }}
          ELEVENTY_CANONICAL_ORIGIN: ${{ env.CANONICAL_DOMAIN }}
          ELEVENTY_BUILD_ID: ${{ github.sha }}
      - run: npx pagefind --site _site
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
      - run: npm run build
        env:
          ELEVENTY_PATH_PREFIX: /kg-marketplace-docs/
          ELEVENTY_OUTPUT_DIR: _site-ghpages
          ELEVENTY_SITE_ORIGIN: https://odin-sons.github.io
          ELEVENTY_CANONICAL_ORIGIN: ${{ env.CANONICAL_DOMAIN }}
          ELEVENTY_BUILD_ID: ${{ github.sha }}
      - run: npx pagefind --site _site-ghpages
      - uses: actions/upload-artifact@v7
        with:
          name: site-ghpages
          path: _site-ghpages

  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site-ghpages
          path: _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - uses: actions/deploy-pages@v5
        id: deployment

  deploy-cloudflare-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://kg-marketplace.pages.dev
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=kg-marketplace
