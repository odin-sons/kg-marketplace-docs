name: Deploy archived docs version

on:
  push:
    branches: ["version/**"]

concurrency:
  group: pages-archive-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CANONICAL_DOMAIN: https://kg-marketplace.pages.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages-archive
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        with:
          path: .cache
          key: build-${{ hashFiles('images/**', 'icons-src/**') }}
          restore-keys: build-
      - run: npm ci
      - run: npm run build
        env:
          ELEVENTY_ARCHIVED_VERSION: "true"
          ELEVENTY_SITE_ORIGIN: ${{ env.CANONICAL_DOMAIN }}
          ELEVENTY_CANONICAL_ORIGIN: ${{ env.CANONICAL_DOMAIN }}
          ELEVENTY_GIT_BRANCH: ${{ github.ref_name }}
          ELEVENTY_BUILD_ID: ${{ github.sha }}
      - run: npx pagefind --site _site
      - uses: cloudflare/wrangler-action@v4
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=kg-marketplace --branch=${{ github.ref_name }}
